---
layout: default
---
{%- assign nl = page.lang | default: 'en' -%}{%- assign t = site.data.i18n[nl] -%}
<article class="case">
  <p class="badge badge-{{ page.evidence_class }}">{{ page.evidence_type }}</p>
  <h1>{{ page.title }}</h1>
  <p class="muted">{{ page.summary }}</p>
  {{ content }}
  <p class="backlink"><a href="{{ t.prefix | append: '/portfolio/' | relative_url }}#artifacts">{{ t.back_portfolio }}</a></p>
</article>

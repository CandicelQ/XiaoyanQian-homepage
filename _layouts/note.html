---
layout: default
---
{%- assign nl = page.lang | default: 'en' -%}{%- assign t = site.data.i18n[nl] -%}
<article class="note">
  <p class="note-date">{{ page.date | date: t.date_format }}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
  <p class="backlink"><a href="{{ t.prefix | append: '/notes/' | relative_url }}">{{ t.all_notes }}</a></p>
</article>

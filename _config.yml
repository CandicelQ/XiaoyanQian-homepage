title: Xiaoyan Qian
description: High-Risk AI Governance and Regulatory Science
tagline: High-Risk AI Governance and Regulatory Science
url: "https://xiaoyanqian.com"
baseurl: ""
author:
  name: Xiaoyan Qian

plugins:
  - jekyll-feed

# The site has no _posts, so move jekyll-feed's default (empty) posts feed out of
# the way and publish the notes collection at the canonical /feed.xml instead.
feed:
  path: "/posts.xml"
  collections:
    notes:
      path: "/feed.xml"

collections:
  cases:
    output: true
    permalink: /cases/:name/
  artifacts:
    output: true
    permalink: /artifacts/:name/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: cases
    values:
      layout: case
  - scope:
      path: ""
      type: artifacts
    values:
      layout: artifact
  - scope:
      path: ""
      type: notes
    values:
      layout: note

markdown: kramdown
